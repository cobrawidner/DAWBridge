# Build DAWBridge.exe on GitHub and attach it to a Release.
#
# Why this exists: the alternative is Travis building locally and copying
# the .exe into Dropbox by hand every time, which means the collaborator's
# copy is only as current as the last time someone remembered. Here, a tag
# produces a download link that is always the real build of that tag.
#
# To cut a release:
#     git tag v0.2.0 && git push origin v0.2.0
#
# The runner must be Windows: PyInstaller builds for the platform it runs
# on, and this ships as a Windows .exe.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # so a build can be triggered without tagging

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write       # needed to create the Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # matches the local build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the tests
        # A build nobody can trust is worse than no build. The suite needs
        # no DAW running, but it does need the two client libraries - they
        # supply real protobuf types and call shapes, and without them 20
        # tests error rather than skip. Verified by simulating a bare
        # runner before this workflow was ever triggered.
        run: python -m pytest -q

      # The interpreter Reaper loads, downloaded from python.org and
      # bundled into the exe. Without this step the build still succeeds
      # and Pro Tools still works, but a Reaper collaborator is back to
      # installing Python by hand - the one step that actually defeated
      # someone. build_exe.py warns rather than failing if it's absent,
      # so this must run first and must not be silently skipped.
      - name: Build the bundled Reaper runtime
        run: python tools/build_reaper_runtime.py

      - name: Build the exe
        run: python tools/build_exe.py

      - name: Check the runtime really got bundled
        # A missing runtime shows up as a warning in the build log, which
        # nobody reads. Measured locally: ~14MB without the runtime, 23.8MB
        # with it. Anything under 20MB means the bundle was silently
        # dropped and the release would ship without the feature it was
        # cut for.
        shell: pwsh
        run: |
          $size = (Get-Item dist/DAWBridge.exe).Length
          Write-Host "DAWBridge.exe is $([math]::Round($size/1MB,1)) MB"
          if ($size -lt 20MB) { throw "exe is too small - the Reaper runtime was not bundled" }

      # Every run leaves a downloadable exe, including a manual one. The
      # Release step below only fires for a tag, so without this a
      # workflow_dispatch build produced nothing you could actually get at.
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: DAWBridge-exe
          path: dist/DAWBridge.exe
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DAWBridge.exe
            docs/HANDBOOK.html
            docs/HANDBOOK.md
            docs/REAPER_SETUP.md
          body: |
            Download **DAWBridge.exe** below and run it. No installation.

            **First time?** Read HANDBOOK.html - open it in any browser. It
            covers the one idea, every button, and what to do when DAWBridge
            warns you about something.

            **Using Reaper?** REAPER_SETUP.md has the one-time Python install.
            Pro Tools needs nothing.

            Built from this tag by GitHub Actions, with the full test suite
            green.
          generate_release_notes: true

      # Announce it in Discord. The URL is a SECRET, never a literal:
      # anyone holding it can post to that channel, and a webhook written
      # into a workflow file is in git history permanently and readable
      # by every collaborator. Set it under
      # Settings > Secrets and variables > Actions > New repository secret,
      # named DISCORD_RELEASE_WEBHOOK.
      #
      # Runs after the release exists so the link in the message works,
      # and only for a tag - a workflow_dispatch build is not a release
      # and should not tell anyone it is.
      - name: Announce the release in Discord
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if (-not $env:WEBHOOK) {
            Write-Host "No DISCORD_RELEASE_WEBHOOK secret is set - skipping the announcement."
            Write-Host "The release itself published fine."
            exit 0
          }
          $tag = "${{ github.ref_name }}"
          $link = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          $text = "**DAWBridge $tag** is out. Download DAWBridge.exe from the release page, then run it - there is nothing to install.`n$link"
          # Assembled rather than ConvertTo-Json'd whole, so allowed_mentions
          # is guaranteed to serialise as [] - PowerShell turns an empty
          # array into an empty string, and Discord would then treat the
          # message as pingable. A release note that @everyone's a server
          # gets the integration switched off within a day.
          $payload = '{"content":' + ($text | ConvertTo-Json) +
                     ',"username":"DAWBridge","allowed_mentions":{"parse":[]}}'
          try {
            Invoke-RestMethod -Uri $env:WEBHOOK -Method Post `
              -ContentType 'application/json; charset=utf-8' `
              -Body ([System.Text.Encoding]::UTF8.GetBytes($payload))
            Write-Host "Told Discord about $tag."
          } catch {
            # A courtesy must never fail a release that already published.
            Write-Host "::warning::Could not post to Discord: $($_.Exception.Message)"
          }
